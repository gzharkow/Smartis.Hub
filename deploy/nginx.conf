# Шаблон обратного прокси nginx -> Next.js (localhost:3000).
# Установка: см. DEPLOY.md, раздел 8.
# После появления домена certbot сам допишет сюда блок https (раздел 10).

server {
    listen 80;
    listen [::]:80;
    server_name flite.smartis.bi;

    # Держим чуть выше MAX_UPLOAD_BYTES в src/lib/assets.ts (500 МБ) —
    # иначе nginx обрывает запрос ДО приложения, и вместо понятной ошибки
    # "Файл больше 500 МБ" пользователь видит голый разрыв соединения.
    client_max_body_size 520m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Большой файл на небыстром канале может грузиться дольше минуты
        # (дефолт nginx) — увеличиваем окно, чтобы не резать загрузку на середине.
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
